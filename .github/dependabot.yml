version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      time: '04:00'
    cooldown:
      default-days: 5
    groups:
      dependencies:
        exclude-patterns:
          - "types-*"
        update-types:
          - "minor"
          - "patch"
      types:
        patterns:
          - "types-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
    cooldown:
      default-days: 5
